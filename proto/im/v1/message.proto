edition = "2024";
package proto.im.v1;
option go_package = "im/gen/go/im/v1;imv1";

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT        = 1;
  MESSAGE_TYPE_IMAGE       = 2;
  MESSAGE_TYPE_VIDEO       = 3;
  MESSAGE_TYPE_FILE        = 4;
  MESSAGE_TYPE_SYSTEM      = 5;
}

message TextMessagePayload {
  string text = 1;
  repeated string at_user_ids = 2;
}

message ImageMessagePayload {
  string url = 1;
  string thumbnail_url = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint64 size_bytes = 5;
  string mime_type = 6;
}

message VideoMessagePayload {
  string url = 1;
  string cover_url = 2;
  uint32 duration_sec = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint64 size_bytes = 6;
}

message FileMessagePayload {
  string url = 1;
  string file_name = 2;
  string extension = 3;
  uint64 size_bytes = 4;
}

message SystemMessagePayload {
  int32 event_code = 1;
  string content = 2;
  map<string, string> extra_params = 3;
}

message MessageBody {
  oneof content {
    TextMessagePayload text = 1;
    ImageMessagePayload image = 2;
    VideoMessagePayload video = 3;
    FileMessagePayload file = 4;
    SystemMessagePayload system = 5;
  }
}

message SendMessageReq {
  string room_id = 1;
  MessageType msg_type = 2;
  bytes payload = 3;
  string reply_to_msg_id = 4;
  bytes ext = 5;
  string client_msg_id = 6 [deprecated = true];
}

message SendMessageAck {
  string msg_id = 1;
  int64 server_time = 2;
  string client_msg_id = 3 [deprecated = true];
  int32 code = 4 [deprecated = true];
  string err_msg = 5 [deprecated = true];
}

message ReadReceipt {
  string room_id = 1;
  int64 last_read_server_time = 2;
}

message TypingEvent {
  string room_id = 1;
  bool is_typing = 2;
}

message Ping {}
message Pong {}

message Ready {
  string session_id = 1;
  int64 server_time = 2;
}

message MessagePersisted {
  string msg_id = 1;
  int64 server_time = 2;
}

message MessageFailed {
  string code = 1;
  string message = 2;
}

message MessageRecalled {
  string msg_id = 1;
  int64 server_time = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

message ClientFrame {
  string client_msg_id = 1;
  oneof payload {
    SendMessageReq send_message = 2;
    ReadReceipt read = 3;
    TypingEvent typing = 4;
    Ping ping = 5;
  }
}

message ServerFrame {
  string client_msg_id = 1;
  oneof payload {
    Ready ready = 2;
    SendMessageAck ack = 3;
    Message message = 4;
    MessagePersisted persisted = 5;
    MessageFailed failed = 6;
    MessageRecalled recalled = 7;
    ReadReceipt read = 8;
    TypingEvent typing = 9;
    Pong pong = 10;
    Error error = 11;
  }
}

message GatewayDeliveryTask {
  string room_id = 1;
  repeated string target_user_ids = 2;
  Message message = 3;
  string client_msg_id = 4;
  MessageFailed failed = 5;
  MessagePersisted persisted = 6;
}

message Message {
  string msg_id = 1;
  string client_msg_id = 2;
  string sender_id = 3;
  string room_id = 4;
  int64 server_time = 5;
  MessageType msg_type = 6;
  bytes payload = 7;
  string reply_to_msg_id = 8;
  bytes ext = 9;
}
