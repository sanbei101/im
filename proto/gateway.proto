syntax = "proto3";

package pb;

option go_package = "github.com/sanbei101/im/proto/pb;pb";

service GatewayService {
  rpc Connect(stream GatewayFrame) returns (stream APIFrame);
}

message GatewayFrame {
  oneof body {
    SendBatch send_batch = 1;
    SessionBatch session_batch = 2;
  }
}

message APIFrame {
  oneof body {
    SendResultBatch send_result_batch = 1;
    NotificationBatch notification_batch = 2;
    RoomPushBatch room_push_batch = 3;
  }
}

message SendBatch { string batch_id = 1; repeated SendMessage messages = 2; }
message SendMessage {
  string request_id = 1;
  string client_msg_id = 2;
  string sender_id = 3;
  string room_id = 4;
  int32 msg_type = 5;
  bytes payload = 6;
  uint64 reply_to_seq = 7;
  bytes ext = 8;
}
message SendResultBatch { string batch_id = 1; repeated SendResult results = 2; }
message SendResult {
  string request_id = 1;
  string client_msg_id = 2;
  string room_id = 4;
  uint64 room_seq = 5;
  int64 server_time = 6;
  int32 code = 7;
  string error = 8;
}

message SessionBatch { repeated Session sessions = 1; }
message Session {
  string user_id = 1;
  bool online = 2;
}

message NotificationBatch { repeated Notification notifications = 1; }
message Notification {
  string user_id = 1;
  string event = 2;
  bytes data = 3;
}

message RoomPushBatch { repeated RoomPush room_pushes = 1; }
message RoomPush {
  string room_id = 1;
  uint64 room_seq = 2;
  string sender_id = 4;
  int32 msg_type = 5;
  bytes payload = 6;
  int64 server_time = 7;
  bytes ext = 8;
  uint64 reply_to_seq = 10;
  repeated string user_ids = 11;
}
