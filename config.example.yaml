api:
  node_id: api-1
  addr: ":9000"
  http_addr: ":8801"
  pprof_addr: "127.0.0.1:6061"
  node_index: 0
  node_count: 1

gateway:
  addr: ":8800"
  api_addrs:
    - "127.0.0.1:9000"
  # HTTP addresses of the API nodes, in node_index order.
  api_http_addrs:
    - "127.0.0.1:8801"
  # HTTP fallback for non-room requests (users, friends, files).
  meta_http_addr: "127.0.0.1:8801"

store:
  path: "./data/api-1"
  backup_path: "./backup/api-1"
  backup_interval_seconds: 3600

shard:
  slots: 1024

# S3-compatible object storage (Cloudflare R2, MinIO, rustfs, AWS S3, ...)
storage:
  # <ACCOUNT_ID>.r2.cloudflarestorage.com, without scheme.
  endpoint: "<ACCOUNT_ID>.r2.cloudflarestorage.com"
  bucket: "im-media"
  access_key: "<S3_ACCESS_KEY>"
  secret_key: "<S3_ACCESS_SECRET>"
  # Use "auto" for R2 and "us-east-1" (or the bucket region) for AWS S3.
  region: "auto"
  use_ssl: true
  # true: <endpoint>/<bucket>/<key> (MinIO/rustfs/local)
  # false: <bucket>.<endpoint>/<key> (R2/AWS S3)
  path_style: false
  # Public read base: CDN, r2.dev domain or a custom domain bound to the
  # bucket. Download URLs become <public_base_url>/<key>; the bucket name is
  # never appended. Required.
  public_base_url: "https://cdn.example.com"

# Required. Use a long random value and keep it identical on every gateway and
# API node.
jwt_secret: ""
