name: 测试与基准
on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 19901:9000
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Benchmark
        shell: bash
        run: set -o pipefail; make bench 2>&1 | tee bench.txt

      - name: Publish benchmark summary
        if: always()
        run: |
          echo "### 🚀 Benchmark" >> $GITHUB_STEP_SUMMARY
          echo '```log' >> $GITHUB_STEP_SUMMARY
          grep -E "^(Benchmark|ok|FAIL)" bench.txt >> $GITHUB_STEP_SUMMARY || echo "no bench output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench.txt
          retention-days: 7
