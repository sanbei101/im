name: 测试与基准
on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write
  deployments: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: 'go.sum'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: im_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d im_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 19901:9000
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Test
        run: make test

      - name: Benchmark
        shell: bash
        run: set -o pipefail; make bench P=1 COUNT=10 2>&1 | tee bench.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: GoBench
          tool: go
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          max-items-in-chart: 100
          summary-always: true
          alert-threshold: '130%'
          fail-on-alert: true
          comment-on-alert: true
