name: CodSpeed Benchmarks

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: >-
            go test -run '^$' -bench . -benchmem
            ./pkg/... ./internal/gateway/... ./internal/router/...
