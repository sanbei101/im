api:
  node_id: api-1
  addr: ":9000"
  node_index: 0
  node_count: 1

gateway:
  addr: ":8800"
  api_addrs:
    - "127.0.0.1:9000"
  max_timeout: 10

store:
  path: "./data/api-1"
  backup_path: "./backup/api-1"
  backup_interval_seconds: 3600

shard:
  slots: 1024

storage:
  endpoint: "127.0.0.1:9001"
  bucket: "im-media"
  access_key_id: "rustfsadmin"
  secret_access_key: "rustfsadmin"
  use_ssl: false
  public_url_prefix: ""
