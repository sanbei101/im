api:
  node_id: api-1
  addr: ":9000"
  node_index: 0
  node_count: 1

gateway:
  addr: ":8800"
  api_addrs:
    - "127.0.0.1:9000"

store:
  path: "./data/api-1"
  backup_path: "./backup/api-1"
  backup_interval_seconds: 3600

shard:
  slots: 1024

storage:
  endpoint: "<ACCOUNT_ID>.r2.cloudflarestorage.com"
  bucket: "im-media"
  access_key: "<S3_ACCESS_KEY>"
  secret_key: "<S3_ACCESS_SECRET>"
  region: "auto"
  use_ssl: true
  path_style: false
  public_base_url: "https://cdn.example.com"

jwt_secret: ""
