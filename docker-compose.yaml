services:
  api:
    build: .
    container_name: im-api
    environment:
      API_NODE_ID: api-1
      API_ADDR: ":9000"
      STORE_PATH: "/data/api-1"
      BACKUP_PATH: "/backup/api-1"
    ports:
      - "9000:9000"
      - "8801:8801"
    volumes:
      - api-data:/data
      - api-backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8801/api/v1/users/batch || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  gateway:
    build: .
    container_name: im-gateway
    environment:
      GATEWAY_ADDR: ":8800"
    ports:
      - "8800:8800"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  api-backup:
